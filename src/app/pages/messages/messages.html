<div class="page chat">
  <aside class="box list">
    <h3>Messages</h3>
    @for (c of conversations(); track c.id) {
      <button class="conv" [class.on]="c.id === id()" (click)="open(c.id)">
        <b>{{ c.counterpart.name }}</b>@if (c.unreadCount) { <span class="pill">{{ c.unreadCount }}</span> }<br>
        <span class="muted">{{ c.lastMessage?.text }}</span>
      </button>
    } @empty { <p class="muted">No conversations yet. Message a provider from their page.</p> }
  </aside>

  <section class="box thread">
    @if (id()) {
      <div class="msgs">
        @for (m of messages(); track m.id) {
          <div class="msg" [class.mine]="m.senderId === auth.user()?.id">{{ m.text }}<small>{{ m.sentAt | date: 'shortTime' }}</small></div>
        }
      </div>
      <div class="row">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" style="flex:1"><mat-label>Write a message</mat-label><input matInput [(ngModel)]="text" (keyup.enter)="send()"></mat-form-field>
        <button mat-flat-button (click)="send()" [disabled]="!text.trim()">Send</button>
      </div>
    } @else { <p class="empty">Pick a conversation.</p> }
  </section>
</div>
