name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Docker build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.config.outputs.image }}
      service: ${{ steps.config.outputs.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REPOSITORY" in
            ijazhub/find-locally-frontend)
              service=frontend
              ;;
            ijazhub/find-locally-backend)
              service=backend
              ;;
            *)
              echo "Unsupported repository: $GITHUB_REPOSITORY"
              exit 1
              ;;
          esac

          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.config.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy application image
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE: ${{ needs.build.outputs.image }}
          SERVICE: ${{ needs.build.outputs.service }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            "${EC2_USER}@${EC2_HOST}" \
            bash -s -- "$IMAGE" "$SERVICE" <<'REMOTE'
          set -euo pipefail

          image="$1"
          service="$2"
          cd /home/find-locally

          test -f docker-compose.yml

          # Prevent overlapping deployments on this instance.
          exec 9> .deployment.lock
          flock -w 600 9

          # Pull successfully before changing the running container.
          docker pull "$image"

          override="$(mktemp)"
          trap 'rm -f "$override"' EXIT

          printf 'services:\n  %s:\n    image: %s\n' \
            "$service" "$image" > "$override"

          docker compose \
            --project-directory /home/find-locally \
            -f docker-compose.yml \
            -f "$override" \
            up -d --no-deps --no-build --pull never "$service"

          docker compose \
            --project-directory /home/find-locally \
            -f docker-compose.yml \
            -f "$override" \
            ps "$service"
          REMOTE

      - name: Remove SSH private key
        if: always()
        run: rm -f ~/.ssh/deploy_key